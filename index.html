<!doctype html>
<!-- App shell: loads fonts, sets the theme before first paint, and mounts React into #root. Added to the Home
     Screen it runs as an app: full screen (no browser bars or address), its own icon, no zooming. -->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#12181B" />
    <meta name="format-detection" content="telephone=no" />
    <!-- Home Screen app: full screen, status bar over the app (the header makes room for it), name and icon -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="PokerWiz" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>PokerWiz</title>

    <!-- Game-style fonts: Fredoka for headings and numbers, Nunito for body text -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@400;600;700;800&display=swap"
      rel="stylesheet"
    />

    <!-- Apply the saved (or system) theme early so the page never flashes the wrong colors -->
    <script>
      (function () {
        var theme;
        try { theme = localStorage.getItem('pokerwiz-theme'); } catch (e) {}
        if (theme !== 'light' && theme !== 'dark') {
          theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        document.documentElement.dataset.theme = theme;
        // Opened from the Home Screen (no browser around it): the CSS makes room for the status bar.
        if (navigator.standalone || window.matchMedia('(display-mode: standalone)').matches) {
          document.documentElement.dataset.standalone = '';
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
