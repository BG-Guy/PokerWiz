[package]
name = "solver-benchmark"
version = "0.1.0"
edition = "2021"
publish = false

# Solver harness for the coach benchmark (see README.md). postflop-solver is AGPL-3.0; it's fetched at
# build time, not vendored.
[dependencies]
postflop-solver = { git = "https://github.com/b-inary/postflop-solver", default-features = false, features = ["rayon"] }
serde_json = "1"

[profile.release]
opt-level = 3
